services:
  db:
    image: mariadb:11.4
    container_name: kidsmap-db
    profiles: ["legacy-mariadb"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${LEGACY_DB_NAME:-kidsmap_prod}
      MARIADB_USER: ${LEGACY_DB_USER:-kidsmap_app}
      MARIADB_PASSWORD: ${LEGACY_DB_PASSWORD:-replace-with-strong-db-password}
      MARIADB_ROOT_PASSWORD: ${LEGACY_DB_ROOT_PASSWORD:-replace-with-strong-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u${LEGACY_DB_USER:-kidsmap_app}", "-p${LEGACY_DB_PASSWORD:-replace-with-strong-db-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    container_name: kidsmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: kidsmap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: kidsmap-web
    restart: unless-stopped
    command: ./scripts/start-server.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      SERVE_MEDIA_FILES: "${SERVE_MEDIA_FILES:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-replace-with-long-random-secret}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_ADMIN_HOST: "${DJANGO_ADMIN_HOST:-}"
      USE_X_FORWARDED_HOST: "${USE_X_FORWARDED_HOST:-1}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-1}"
      SESSION_COOKIE_HTTPONLY: "${SESSION_COOKIE_HTTPONLY:-1}"
      SECURE_CONTENT_TYPE_NOSNIFF: "${SECURE_CONTENT_TYPE_NOSNIFF:-1}"
      SECURE_REFERRER_POLICY: "${SECURE_REFERRER_POLICY:-same-origin}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-1}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-1}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-0}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GOOGLE_ANALYTICS_MEASUREMENT_ID: "${GOOGLE_ANALYTICS_MEASUREMENT_ID:-}"
      GOOGLE_ANALYTICS_PROPERTY_ID: "${GOOGLE_ANALYTICS_PROPERTY_ID:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp-relay.brevo.com}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-1}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-0}"
      EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-20}"
      EMAIL_OTP_TTL_MINUTES: "${EMAIL_OTP_TTL_MINUTES:-10}"
      EMAIL_OTP_RESEND_COOLDOWN_SECONDS: "${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:-60}"
      EMAIL_OTP_MAX_ATTEMPTS: "${EMAIL_OTP_MAX_ATTEMPTS:-5}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@kidsmap.az}"
      SERVER_EMAIL: "${SERVER_EMAIL:-noreply@kidsmap.az}"
      MEDIA_CACHE_MAX_AGE: "${MEDIA_CACHE_MAX_AGE:-86400}"
      DB_ENGINE: "${DB_ENGINE:-postgres}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      USE_RUNSERVER: "${USE_RUNSERVER:-0}"
      RUN_COLLECTSTATIC_ON_RELEASE: "${RUN_COLLECTSTATIC_ON_RELEASE:-1}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    volumes:
      - ./:/app

volumes:
  mariadb_data:
  postgres_data:
  redis_data:
