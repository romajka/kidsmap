services:
  db:
    image: mariadb:11.4
    container_name: kidsmap-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-kidsmap}
      MARIADB_USER: ${DB_USER:-kidsmap}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kidsmap}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u${DB_USER:-kidsmap}", "-p${DB_PASSWORD:-kidsmap}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: kidsmap-web
    command: ./scripts/start-server.sh
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      SERVE_MEDIA_FILES: "${SERVE_MEDIA_FILES:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-dev-only-change-me}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_ADMIN_HOST: "${DJANGO_ADMIN_HOST:-}"
      USE_X_FORWARDED_HOST: "${USE_X_FORWARDED_HOST:-1}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-1}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-1}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GOOGLE_ANALYTICS_MEASUREMENT_ID: "${GOOGLE_ANALYTICS_MEASUREMENT_ID:-}"
      GOOGLE_ANALYTICS_PROPERTY_ID: "${GOOGLE_ANALYTICS_PROPERTY_ID:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp-relay.brevo.com}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-1}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-0}"
      EMAIL_TIMEOUT: "${EMAIL_TIMEOUT:-20}"
      EMAIL_OTP_TTL_MINUTES: "${EMAIL_OTP_TTL_MINUTES:-10}"
      EMAIL_OTP_RESEND_COOLDOWN_SECONDS: "${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:-60}"
      EMAIL_OTP_MAX_ATTEMPTS: "${EMAIL_OTP_MAX_ATTEMPTS:-5}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@kidsmap.az}"
      SERVER_EMAIL: "${SERVER_EMAIL:-noreply@kidsmap.az}"
      MEDIA_CACHE_MAX_AGE: "${MEDIA_CACHE_MAX_AGE:-86400}"
      DB_ENGINE: "mariadb"
      DB_NAME: "${DB_NAME:-kidsmap}"
      DB_USER: "${DB_USER:-kidsmap}"
      DB_PASSWORD: "${DB_PASSWORD:-kidsmap}"
      DB_HOST: "db"
      DB_PORT: "3306"
      USE_RUNSERVER: "${USE_RUNSERVER:-0}"
      RUN_COLLECTSTATIC_ON_START: "${RUN_COLLECTSTATIC_ON_START:-0}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    volumes:
      - ./:/app

volumes:
  mariadb_data:
