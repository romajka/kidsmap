<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Каталог</title></head>
<body>
  <h1>Каталог</h1>

  {% for place in places %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
      <b><a href="{% url 'place_detail' place.id %}">{{ place.name }}</a></b>
      — {{ place.get_category_display }}<br>
      {{ place.district }} / {{ place.metro }}
    </div>
  {% empty %}
    <p>Пока нет мест.</p>
  {% endfor %}
</body>
</html>
