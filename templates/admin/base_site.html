{% extends "admin/base.html" %}
{% load i18n %}

{% block branding %}
  <h1 id="site-name"><a href="{% url 'admin:index' %}">{% translate "Django administration" %}</a></h1>
{% endblock %}

{% block userlinks %}
  <form action="{% url 'set_language' %}" method="post" style="display:inline; margin-right:10px;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}" />
    <button type="submit" name="language" value="ru" style="background:none;border:none;color:#79aec8;cursor:pointer;padding:0 4px;">RU</button>
    <span style="color:#79aec8;">/</span>
    <button type="submit" name="language" value="az" style="background:none;border:none;color:#79aec8;cursor:pointer;padding:0 4px;">AZ</button>
    <span style="color:#79aec8;">/</span>
    <button type="submit" name="language" value="en" style="background:none;border:none;color:#79aec8;cursor:pointer;padding:0 4px;">EN</button>
  </form>
  {{ block.super }}
{% endblock %}
