{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <div id="content-main">
    <div class="module">
      <h2>{% trans "Выберите раздел для редактирования" %}</h2>
      <ul style="list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;">
        {% for section in sections %}
          <li style="border:1px solid #d9e3ec;border-radius:10px;padding:12px;">
            <a href="{{ section.url }}" style="font-weight:700;text-decoration:none;">{{ section.title }}</a>
            <div style="margin-top:4px;color:#617084;">{{ section.description }}</div>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
