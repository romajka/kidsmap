name: Deploy To Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kidsmap
          POSTGRES_USER: kidsmap
          POSTGRES_PASSWORD: postgrespass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kidsmap -d kidsmap"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DJANGO_DEBUG: "0"
      DJANGO_TESTING: "1"
      DJANGO_SECRET_KEY: "ci-secret-key-for-kidsmap-not-for-prod"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost"
      DATABASE_URL: "postgresql://kidsmap:postgrespass@127.0.0.1:5432/kidsmap"
      REDIS_URL: "redis://127.0.0.1:6379/0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Ensure migrations committed
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --parallel auto

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/kidsmap
            ./scripts/deploy-server.sh main
