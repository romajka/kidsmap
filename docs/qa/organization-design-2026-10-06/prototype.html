 owner:tr('Подключить места','Məkanları qoş','Connect places'),empty:tr('Организация без филиалов','Filialsız təşkilat','Organization without branches'),create:tr('Создать организацию','Təşkilat yarat','Create organization'),branch:tr('Новый филиал','Yeni filial','New branch'),admin:tr('Массовая операция','Kütləvi əməliyyat','Bulk operation'),review:tr('Просмотр и конфликты','Siyahı və konfliktlər','Review and conflicts'),result:tr('Результат по карточкам','Kartlar üzrə nəticə','Per-card results'),detach:tr('Отвязка и перенос','Ayırma və köçürmə','Detach and move'),team:tr('Роли и доступ','Rollar və giriş','Roles and access'),org:tr('Открытие · тестовая сеть','Açılış · test şəbəkəsi','Discovery · test network'),place:tr('Место','Məkan','Place'),address:tr('Адрес','Ünvan','Address'),noorg:tr('Без организации','Təşkilatsız','No organization'),target:tr('Организация назначения','Hədəf təşkilat','Target organization'),selected:tr('Выбрано','Seçilib','Selected'),cancel:tr('Отмена','Ləğv et','Cancel'),back:tr('Назад','Geri','Back'),reviewBtn:tr('Посмотреть список','Siyahıya bax','Review selection'),confirmed:tr('Подтверждённая связь','Təsdiqlənmiş əlaqə','Confirmed affiliation'),info:tr('Информационная связь','Məlumat əlaqəsi','Information affiliation'),open:tr('Открыть карточку','Kartı aç','Open card'),ready:tr('Можно подключить','Qoşmaq olar','Ready to connect'),waiting:tr('Ждёт владельца места','Məkan sahibini gözləyir','Awaiting place owner'),already:tr('Уже подключено','Artıq qoşulub','Already connected'),other:tr('В другой сети','Başqa şəbəkədədir','In another network'),changed:tr('Карточка изменилась','Kart dəyişib','Card changed'),current:tr('Текущая организация','Cari təşkilat','Current organization')};

if(view==='owner'){
html=hero(tr('Организация / филиалы','Təşkilat / filiallar','Organization / branches'),T.owner,bodyCopy,link('branch','+ '+tr('Создать новый филиал','Yeni filial yarat','Create new branch')))+`<div class="callout"><strong>${T.org}</strong><p>${tr('Вы владелец организации. Своё место подключите сразу; для чужого отправьте запрос его владельцу. До подтверждения сетевой доступ не появится.','Siz təşkilatın sahibisiniz. Öz məkanınız dərhal qoşulur; başqa sahibin məkanı üçün sorğu göndərin. Təsdiqədək şəbəkə girişi açılmır.','You own this organization. Your own places connect immediately; other owners must confirm a request. Network access starts only after confirmation.')}</p></div><section class="card"><h2>${tr('Найти готовые карточки','Hazır kartları tap','Find existing cards')}</h2><div class="filters"><label>${tr('Название или адрес','Ad və ya ünvan','Name or address')}<input id="search" type="search" placeholder="${tr('Например: Ясамал или улица 1','Məsələn: Yasamal və ya küçə 1','For example: Yasamal or street 1')}"></label><label>${tr('Доступность подключения','Qoşulma imkanı','Connection availability')}<select id="filter"><option value="all">${tr('Все доступные результаты','Bütün açıq nəticələr','All visible results')}</option><option value="ready">${tr('Мои места без сети','Şəbəkəsiz məkanlarım','My places without a network')}</option><option value="pending">${tr('Запросы и конфликты','Sorğular və konfliktlər','Requests and conflicts')}</option></select></label></div><p class="readonly-label" style="margin-top:12px">${tr('Чужие карточки доступны здесь только с публичными сведениями. Закрытые черновики не показываются.','Başqa sahibin kartında yalnız açıq məlumat görünür. Qapalı qaralamalar göstərilmir.','Other owners’ cards show public details only. Private drafts are hidden.')}</p><div class="toolbar"><label class="check"><input id="select-all" type="checkbox">${tr('Выбрать доступные на странице','Səhifədə uyğun olanları seç','Select eligible cards on this page')}</label><span class="count" id="count" aria-live="polite">${T.selected}: 0</span></div><div class="rows" id="search-rows">${row(0,{checkbox:true,detail:tr('Вы владелец места и сети','Məkanın və şəbəkənin sahibisiniz','You own the place and network')})}${row(1,{checkbox:true,detail:tr('Вы владелец места и сети','Məkanın və şəbəkənin sahibisiniz','You own the place and network')})}${row(10,{status:T.waiting,tone:'warn',detail:tr('Запрос №42 · вы подтвердили. Повторный запрос не нужен.','Sorğu №42 · təsdiqləmisiniz. Yenidən sorğu lazım deyil.','Request #42 · you confirmed. No new request needed.')})}${row(11,{status:T.already,tone:'neutral',organization:T.org,detail:tr('Связь актуальна · подтверждена владельцами','Əlaqə aktualdır · sahiblər təsdiqləyib','Current affiliation · owners confirmed')})}${row(12,{status:T.other,tone:'bad',organization:tr('Другая тестовая сеть','Başqa test şəbəkəsi','Another test network'),detail:tr('Подключение заблокировано. Сначала отдельно согласуйте отвязку.','Qoşulma bağlıdır. Əvvəl ayırmanı ayrıca razılaşdırın.','Connection blocked. Review detachment separately first.')})}<details><summary>${tr('Другие состояния связи','Digər əlaqə vəziyyətləri','Other affiliation states')}</summary>${row(13,{status:T.info,tone:'info',organization:T.org,detail:tr('Не даёт сетевого доступа. Бизнес-связь требует отдельного согласия владельцев.','Şəbəkə girişi vermir. Biznes əlaqəsi ayrıca sahib razılığı tələb edir.','Grants no network access. Business affiliation needs separate owner consent.')})}${row(14,{status:tr('Связь устарела','Əlaqə köhnəlib','Affiliation is stale'),tone:'warn',organization:T.org,detail:tr('Владелец изменился. Доступ по этой связи не действует; нужно актуальное подтверждение.','Sahib dəyişib. Bu əlaqə ilə giriş yoxdur; aktual təsdiq lazımdır.','Owner changed. This affiliation grants no access; current confirmation is needed.')})}${row(15,{status:tr('Нет владельца места','Məkan sahibi yoxdur','Place has no owner'),tone:'bad',detail:tr('Для бизнес-связи сначала требуется установленный владелец. Назначать себя по кнопке нельзя.','Biznes əlaqəsi üçün əvvəl sahib müəyyən olunmalıdır. Düymə ilə özünü sahib təyin etmək olmaz.','A business affiliation requires an established owner first. This button cannot claim ownership.')})}</details><details id="more"><summary>${tr('Ещё 8 моих мест без организации','Daha 8 şəbəkəsiz məkanım','8 more of my places without an organization')}</summary>${[2,3,4,5,6,7,8,9].map(i=>row(i,{checkbox:true})).join('')}</details><p id="no-match" hidden class="no-selection">${tr('Совпадений нет. Попробуйте другой адрес или название.','Uyğun nəticə yoxdur. Başqa ünvan və ya ad sınayın.','No matches. Try another address or name.')}</p></div></section><div class="foot"><p>${tr('Подключение не меняет владельца и публикацию карточки.','Qoşulma sahib və dərc vəziyyətini dəyişmir.','Connection changes neither card ownership nor publication.')}</p><div class="actions"><button class="primary" id="owner-review" disabled>${T.reviewBtn}</button></div></div><p id="owner-status" class="demo-state" role="status"></p>`;
