const locations=()=>heading(c.locations,c.locationHint)+`<div class="notice">${c.formatHint}</div><div id="location-list">${locationCard(1)}${locationCard(2)}${Array.from({length:added},(_,i)=>locationCard(i+3)).join('')}</div><button id="add-location" style="margin-top:16px">${c.addLocation}</button><details class="accordion"><summary>${c.history}</summary><p class="hint">${c.historyHint}</p></details>`;

tion><option value="offline">${c.offline}</option><option value="both" selected>${c.both}</option></select></label><div id="format-locations">${locations()}</div>`;case 7:return heading(c.pricing,c.priceHint)+`<div class="grid">${field('price-from',c.priceFrom,'20','','number')}${field('price-to',c.priceTo,'60','','number')}</div>`+field('duration',c.duration,'45',c.optional,'number')+'<hr>'+heading(c.contacts,c.contactHint)+field('general-phone',c.phone,'+994 00 000 00 00','','tel')+field('whatsapp',c.whatsapp,'','','tel')+field('website','Website','https://example.invalid','','url')+field('instagram','Instagram','');case 8:return locations();case 9:return heading(c.education,c.educationHint)+area('education',c.educationLabel,'',c.educationSample)+area('experience-info',c.experienceInfo);case 10:if(proposal||admin)return heading(c.documents,c.docHint)+`<div class="notice">${c.privateHint}</div><p>${c.consentHint}</p>`;return heading(c.documents,c.docHint)+`<div class="doc"><div class="inline"><strong>${c.identity}</strong><span class="badge amber">${c.private}</span></div><p class="hint">${c.privateHint}</p></div><div class="notice"><h3>${c.claim}</h3><p>${c.claimHint}</p></div><div class="doc"><div class="inline"><strong>${c.certificate}</strong><span class="badge">${c.approved}</span></div>${check('certificate-consent',c.publicChoice,false)}<p class="hint">${c.consentHint}</p></div><button id="upload-doc">${c.uploadDoc}</button><p class="hint">${c.limits}</p>`;case 11:return heading(c.contacts,c.contactHint)+field('general-phone',c.phone,'+994 00 000 00 00','','tel')+field('whatsapp',c.whatsapp,'','','tel')+field('website','Website','https://example.invalid','','url')+field('instagram','Instagram','');case 12:if(admin)return heading(c.moderation,c.adminRules)+`<div class="notice fail"><a href="#city-2" data-error="region">${c.fixRegion}</a></div><ul><li>${c.c1}</li><li>${c.c4}</li></ul><p class="hint">${c.recommend}</p><label class="field" for="admin-status"><span>${c.moderation}</span><select id="admin-status"><option>${c.draft}</option><option>${c.pending}</option></select></label><div class="notice">${c.privateHint}</div>`;return heading(c.reviewTitle)+`<div class="notice fail"><h3>${c.errors}</h3><a href="#general-phone" data-error="phone">${c.fixPhone}</a><br><a href="#city-2" data-error="region">${c.fixRegion}</a></div><h3>${c.checklist}</h3><ul>${['c1','c2','c3','c4'].map(k=>`<li>${c[k]}</li>`).join('')}</ul><p class="hint">${c.recommend}</p>${admin?`<div class="notice">${c.adminRules}</div>`:''}<div class="notice warn">${c.publishedWarning}</div><p class="small">${c.statusNew}</p><hr><h3>${c.preview}</h3><p class="hint">${c.previewHint}</p><div class="preview"><h3>Leyla Aliyeva</h3><p>${c.logoped} · ${c.psych}</p><p>${c.both} · ${c.baku}</p><p>${c.bioSample}</p></div><div class="notice"><h3>${c.restore}</h3><p>${c.restoreHint}</p><div class="inline"><button class="restore">${c.restoreButton}</button><button class="restore">${c.keepServer}</button></div></div><details class="accordion"><summary>${c.version}</summary><p>${c.stale}</p></details>`;case 13:return heading(c.cooperation,c.invHint)+`<div class="location"><h3>${c.orgName}</h3><span class="badge amber">${c.pending}</span><div class="row"><div>${c.confirmPerson}<p>${c.noConsent}</p></div></div><div class="row"><div>${c.confirmOrg}<p>${c.noConsent}</p></div></div><div class="inline"><button id="accept-invite" class="primary">${c.accept}</button><button id="decline-invite">${c.decline}</button></div></div><div class="notice">${c.locationHint}</div>`;}}
function chips(){const el=document.getElementById('selected');if(!el)return;el.innerHTML=`<span class="hint">${c.selected}: ${selected.size}</span>`+[...selected].map(k=>`<span class="chip">${c[k]}<button aria-label="${c.cancel}: ${c[k]}" data-remove="${k}">×</button></span>`).join('');el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);document.getElementById('dir-'+b.dataset.remove).checked=false;chips();status(c.dirty,c.local)});}
let values={};function render(id,focus=false){document.querySelectorAll('#content input,#content select,#content textarea').forEach(el=>{if(el.type==='checkbox'&&el.id)values['check:'+el.id]=el.checked;else if(el.type!=='file'&&el.type!=='radio'&&el.id)values[el.id]=el.value});current=Number(id);headingSequence=0;const choices=admin?sections.map((k,i)=>[k,i+1]):userSections;const extra=[[c.locations,8],[c.documents,10],[c.invitation,13],[c.review,12]];let list=choices.map(([k,i])=>[c[k],i]);if(!admin)list=list.concat(proposal?extra.filter(x=>x[1]===8||x[1]===12):extra);document.getElementById('nav').innerHTML=list.map(([label,i],n)=>`<a href="#section-${i}" data-section="${i}" ${current===i?'aria-current="page"':''}><span class="n">${admin||n<5?n+1:'↗'}</span>${label}</a>`).join('')+`<p>${admin?c.adminRules:c.manual}</p>`;document.getElementById('section-jump').innerHTML=list.map(([label,i],n)=>`<option value="${i}" ${current===i?'selected':''}>${admin||n<5?(n+1)+'. ':''}${label}</option>`).join('');document.getElementById('content').innerHTML=`<section class="card" id="section-${id}"><div class="eyebrow">${admin?'KidsMap · '+c.admin:c.person}</div>${body(current)}</section>`;document.querySelectorAll('#content input,#content select,#content textarea').forEach(el=>{if(el.id in values)el.value=values[el.id];if(('check:'+el.id) in values)el.checked=values['check:'+el.id]});document.querySelectorAll('[data-section]').forEach(a=>a.onclick=e=>{e.preventDefault();render(a.dataset.section,true)});document.getElementById('section-jump').onchange=e=>render(e.target.value,true);
chips();document.querySelectorAll('.dirrow input').forEach(el=>el.onchange=()=>{el.checked?selected.add(el.closest('.dirrow').dataset.key):selected.delete(el.closest('.dirrow').dataset.key);chips()});const search=document.getElementById('direction-search');if(search)search.oninput=()=>{const term=search.value.toLocaleLowerCase(lang).trim();let count=0;document.querySelectorAll('.dirrow').forEach(row=>{row.hidden=!row.dataset.search.includes(term);if(!row.hidden)count++});text('result-count',count?String(count):c.empty)};
const add=document.getElementById('add-location');if(add)add.onclick=()=>{const n=3+added++;document.getElementById('location-list').insertAdjacentHTML('beforeend',locationCard(n));document.getElementById('address-'+n).focus();status(c.dirty,c.local)};document.querySelectorAll('[data-deactivate]').forEach(b=>b.onclick=()=>{const article=b.closest('article');article.querySelector('header p').textContent=c.history;article.style.opacity='.7';b.disabled=true;status(c.dirty,c.local)});
const format=document.getElementById('format-select');if(format)format.onchange=()=>{document.getElementById('format-locations').hidden=format.value==='online';status(c.dirty,c.local)};
document.querySelectorAll('[data-error]').forEach(a=>a.onclick=e=>{e.preventDefault();const phone=a.dataset.error==='phone';render(phone?11:8);const target=document.getElementById(phone?'general-phone':'city-2');target.value='';target.setAttribute('aria-invalid','true');target.insertAdjacentHTML('afterend',`<p class="error" id="target-error">${phone?c.fixPhone:c.locationError}</p>`);target.setAttribute('aria-describedby','target-error');target.focus()});
const photo=document.getElementById('choose-photo');if(photo)photo.onclick=()=>document.getElementById('photo-file').click();['upload-doc','accept-invite','decline-invite'].forEach(id=>{const button=document.getElementById(id);if(button)button.onclick=()=>status(c.demoSaved,c.manual)});document.querySelectorAll('.restore').forEach(b=>b.onclick=()=>{b.closest('.notice').hidden=true;status(c.demoSaved,c.manual)});
if(focus){document.getElementById('panel-title').focus();window.scrollTo({top:0,behavior:'instant'})}}
document.getElementById('content').addEventListener('input',()=>status(c.dirty,c.local));document.getElementById('content').addEventListener('change',()=>status(c.dirty,c.local));document.getElementById('save-draft').onclick=()=>status(c.demoSaved,c.manual);document.getElementById('send').onclick=()=>{render(12,true);status(c.demoSaved,c.manual)};render(current);
</script></html>
