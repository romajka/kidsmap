gram')}</p><strong>Keramika</strong><p class="hint">${tr('Своя категория занятия: творчество · керамика','Məşğələ kateqoriyası: yaradıcılıq · keramika','Activity taxonomy: arts · ceramics')}</p><div class="group"><div class="summary"><div><p class="entity">${tr('Группа','Qrup','Group')}</p><strong>Kiçik ustalar</strong><p>${tr('5–7 лет · AZ · Суббота 11:00–12:00','5–7 yaş · AZ · Şənbə 11:00–12:00','Ages 5–7 · AZ · Saturday 11:00–12:00')}</p></div><button class="btn" type="button">${tr('Изменить группу','Qrupu dəyiş','Edit group')}</button></div><div class="price-row"><span>${tr('Тариф группы · одно занятие','Qrup tarifi · bir məşğələ','Group plan · one lesson')}</span><strong>20 ₼</strong></div><details><summary>${tr('Условия, преподаватели и тарифы','Şərtlər, müəllimlər və tariflər','Conditions, teachers and plans')}</summary><p class="hint">${tr('Расписание группы не заменяет часы работы места.','Qrup cədvəli məkanın iş saatlarını əvəz etmir.','Group times do not replace Place opening hours.')}</p><div class="fields">${field('group-schedule',tr('Расписание группы','Qrup cədvəli','Group schedule'),'Saturday 11:00–12:00')}${field('group-teacher',tr('Преподаватель','Müəllim','Teacher'),'Leyla')}</div></details></div><button type="button" class="plain">＋ ${tr('Добавить группу','Qrup əlavə et','Add group')}</button></div>`}<button type="button" class="btn">＋ ${tr('Добавить занятие','Məşğələ əlavə et','Add activity')}</button><details><summary>${tr('Дополнительные условия и прежние сведения','Əlavə şərtlər və əvvəlki məlumat','Additional terms and previous details')}</summary><p class="hint">${tr('Сохранённые поля остаются доступными. Общее описание места не переносится в группы.','Saxlanmış sahələr açıq qalır. Məkan təsviri qruplara köçürülmür.','Existing fields remain available. Place descriptions are not moved into groups.')}</p></details>`;

sections.forEach(([id,title],index)=>{const num=String(index+1).padStart(2,'0');$('nav').insertAdjacentHTML('beforeend',`<a href="#${id}" data-section="${id}"><span class="num">${num}</span><span>${title}</span>${error&&id==='location'?'<span class="mark">2</span>':''}</a>`);$('section-select').insertAdjacentHTML('beforeend',`<option value="${id}">${index+1} / ${sections.length} · ${title}</option>`);$('content').insertAdjacentHTML('beforeend',`<section class="section" id="${id}" aria-labelledby="${id}-heading"><div class="section-heading"><span class="num">${num}</span><div><h2 id="${id}-heading" tabindex="-1">${title}</h2><p>${tr('Обязательные поля отмечены для отправки.','Göndərmək üçün məcburi sahələr işarələnib.','Required marks apply to submission.')}</p></div></div>${contents[id]}</section>`);});
$('rail-note').innerHTML=`<strong>${tr('Черновик ≠ публикация','Qaralama ≠ dərc','Draft ≠ publication')}</strong>${tr('Можно сохранить неполную карточку. Для отправки понадобятся отмеченные поля.','Natamam kartı saxlamaq olar. Göndərmək üçün işarələnmiş sahələr lazımdır.','Save an incomplete card. Submission needs the marked fields.')}`;

function active(id){document.querySelectorAll('#nav a').forEach(a=>{const match=a.dataset.section===id;a.classList.toggle('active',match);if(match)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});$('section-select').value=id;}
function jump(id,focus=false){const el=$(id);if(!el)return;el.closest('details')?.setAttribute('open','');el.scrollIntoView({block:'start',behavior:'instant'});active(el.closest('.section')?.id||id);if(focus)el.focus({preventScroll:true});}
$('section-select').onchange=e=>{jump(e.target.value);$(e.target.value+'-heading').focus({preventScroll:true});};document.querySelectorAll('#nav a').forEach(a=>a.onclick=e=>{e.preventDefault();jump(a.dataset.section);$(a.dataset.section+'-heading').focus({preventScroll:true});});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump,true));
$('mock-lang').value=lang;$('mock-state').value=state;['lang','state'].forEach(key=>$('mock-'+key).onchange=e=>{params.set(key,e.target.value);location.search=params.toString();});
document.querySelectorAll('#content input,#content textarea,#content select').forEach(input=>input.addEventListener('input',()=>{set('save-main',tr('Есть несохранённые изменения','Saxlanmamış dəyişikliklər var','You have unsaved changes'));set('footer-main',$('save-main').textContent);}));
set('dialog-title',tr('Это макет интерфейса','Bu interfeys maketidir','This is an interface prototype'));set('dialog-text',tr('Сохранение и отправка выполняются только в рабочей форме. Здесь можно проверить навигацию, поля и переход к ошибке.','Saxlama və göndərmə yalnız işlək formada aparılır. Burada naviqasiya, sahələr və səhvlərə keçid yoxlanıla bilər.','Saving and submission work only in the application. This prototype demonstrates navigation, fields and error focus.'));$('save-button').onclick=()=>$('mock-dialog').showModal();$('send-button').onclick=()=>jump('review');$('dialog-close').onclick=()=>$('mock-dialog').close();

set('footer-main',$('save-main').textContent);set('footer-detail',admin?tr('Сохранение по кнопке · текущие права публикации','Düymə ilə saxlanılır · mövcud dərc hüquqları','Manual save · existing publication permissions'):tr('Черновик редакции · фото сохраняются по кнопке','Redaksiya qaralaması · şəkillər düymə ilə saxlanılır','Edit draft · save photos with the button'));if(empty){document.querySelectorAll('.checks li').forEach(n=>{n.classList.remove('done');n.textContent=n.textContent.replace('✓','○')});document.querySelector('.price-row').innerHTML=tr('Тарифы не добавлены','Tariflər əlavə edilməyib','No plans added');document.querySelectorAll('.hours').forEach(n=>n.hidden=true);document.querySelector('.preview-tags').hidden=true;document.querySelector('.preview-body p').textContent=tr('Адрес не указан','Ünvan göstərilməyib','Address missing');}active(sections[0][0]);if(location.hash)setTimeout(()=>jump(location.hash.slice(1)),50);
