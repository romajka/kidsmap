{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_top %}
  {{ block.super }}
  {% if not is_popup %}
    <div class="submit-row km-admin-submit-row km-admin-submit-row--secondary">
      <input
        type="submit"
        value="{% translate 'Сохранить и рассчитать координаты' %}"
        name="_refresh_coordinates_from_address"
      />
    </div>
  {% endif %}
{% endblock %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if not is_popup %}
    <div class="submit-row km-admin-submit-row km-admin-submit-row--secondary">
      <input
        type="submit"
        value="{% translate 'Сохранить и рассчитать координаты' %}"
        name="_refresh_coordinates_from_address"
      />
    </div>
  {% endif %}
{% endblock %}
