{% load i18n %}
<a
  href="#{{ section.id }}"
  class="km-pf-navitem is-{{ section.state.state|default:'empty' }}"
  data-place-step-link
  data-pf-nav-for="{{ section.id }}"
  aria-label="{{ section.step }}. {{ section.title }}. {{ section.description }}"
>
  <span class="km-pf-navitem__num">{{ section.step }}</span>
  <span class="km-pf-navitem__copy">
    <span class="km-pf-navitem__title">{{ section.title }}</span>
    <span class="km-pf-navitem__sub" data-pf-nav-sub>{{ section.state.label }}</span>
  </span>
  <svg class="km-i km-pf-navitem__state" viewBox="0 0 960 960" aria-hidden="true" focusable="false"><use data-pf-nav-icon href="#kmi-{{ section.state.icon|default:'radio_button_unchecked' }}"></use></svg>
</a>
