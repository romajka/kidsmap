{% load i18n %}
{% if has_add_permission or has_change_permission or perms.catalog.change_event %}
<details class="mb-3">
  <summary class="btn btn-outline-primary">
    <svg class="km-i" width="18" height="18" fill="currentColor" viewBox="0 0 960 960" aria-hidden="true" focusable="false"><use href="#kmi-content_copy"></use></svg>
    {% translate "ИИ-промпт для афиши" %}
  </summary>
  <div class="mt-3">
    <label for="event-editor-prompt">{% translate "Скопируйте задание и вставьте его в чат ИИ с доступом к браузеру." %}</label>
    <textarea id="event-editor-prompt" class="form-control mb-2" rows="8" readonly spellcheck="false" lang="ru">{% include "admin/catalog/event/portable_prompt.txt" %}</textarea>
    <button type="button" class="btn btn-primary" data-copy-event-prompt
            data-success="{% translate 'Промпт скопирован.' %}"
            data-fallback="{% translate 'Текст выделен. Скопируйте его через меню браузера или сочетанием клавиш.' %}">{% translate "Скопировать промпт" %}</button>
    <span class="ml-2" role="status" aria-live="polite"></span>
  </div>
</details>
{% endif %}
