{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<div
  class="owner-file-uploader owner-file-uploader-multiple js-file-uploader"
  data-file-uploader
  data-upload-mode="multiple"
  data-upload-empty="{% if CURRENT_LANGUAGE == 'az' %}10-dək şəkil əlavə edin. Hər biri JPG, PNG və ya WEBP, maksimum 2 MB.{% elif CURRENT_LANGUAGE == 'en' %}Add up to 10 images. Each JPG, PNG, or WEBP, up to 2 MB.{% else %}{% trans 'Добавьте до 10 изображений в формате JPG, PNG или WEBP, каждое до 2 МБ.' %}{% endif %}"
  data-upload-summary="{% if CURRENT_LANGUAGE == 'az' %}Seçilmiş fayllar:{% elif CURRENT_LANGUAGE == 'en' %}Selected files:{% else %}{% trans 'Выбрано файлов:' %}{% endif %}"
>
  <label class="owner-file-uploader-drop">
    <span class="owner-file-uploader-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 16V6M12 6l-4 4m4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 17.5a2.5 2.5 0 0 0 2.5 2.5h9a2.5 2.5 0 0 0 2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="owner-file-uploader-copy">
      <strong class="owner-file-uploader-title">{% if CURRENT_LANGUAGE == "az" %}Galereya üçün şəkillər{% elif CURRENT_LANGUAGE == "en" %}Gallery photos{% else %}{% trans "Добавьте фото для галереи" %}{% endif %}</strong>
      <span class="owner-file-uploader-meta" data-upload-meta>
        {% if CURRENT_LANGUAGE == "az" %}10-dək şəkil əlavə edin. Hər biri JPG, PNG və ya WEBP, maksimum 2 MB.{% elif CURRENT_LANGUAGE == "en" %}Add up to 10 images. Each JPG, PNG, or WEBP, up to 2 MB.{% else %}{% trans "Добавьте до 10 изображений в формате JPG, PNG или WEBP, каждое до 2 МБ." %}{% endif %}
      </span>
    </span>
    <span class="owner-file-uploader-action" data-upload-trigger role="button" tabindex="0">{% if CURRENT_LANGUAGE == "az" %}Faylları seçin{% elif CURRENT_LANGUAGE == "en" %}Choose files{% else %}{% trans "Выбрать файлы" %}{% endif %}</span>
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %} data-upload-input />
  </label>
  <div class="owner-file-uploader-list" data-upload-list hidden></div>
</div>
