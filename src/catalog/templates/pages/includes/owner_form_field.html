{% load i18n %}

<label class="owner-form-field{% if full_width %} owner-form-field-full{% endif %}{% if temp_required %} owner-temp-required-field{% endif %}"{% if temp_required %} data-temp-required-field="1"{% endif %}>
  <span class="owner-form-label">
    {{ field.label }}
    {% if field.field.required %}
      <span class="required-mark" aria-hidden="true">*</span>
    {% endif %}
    {% if temp_required %}
      <span class="required-mark owner-temp-required-mark" aria-hidden="true" hidden>*</span>
    {% endif %}
  </span>
  {{ field }}
  {% if field.help_text %}
    <small class="meta">{{ field.help_text }}</small>
  {% endif %}
  {% for error in field.errors %}
    <small class="auth-errors">{{ error }}</small>
  {% endfor %}
</label>
