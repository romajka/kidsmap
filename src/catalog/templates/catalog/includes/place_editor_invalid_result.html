{% if request.method == 'POST' and form.is_bound %}{% if form.errors or errors %}<span hidden data-km-editor-result data-outcome="validation" data-action="{% if request.POST.form_action == 'save_and_publish' or request.POST.action == 'submit' %}moderation{% elif '_publish_place' in request.POST %}publish{% elif request.POST.form_action == 'save_draft' or request.POST.action == 'draft' or '_save_draft' in request.POST %}draft{% else %}save{% endif %}">{{ form.non_field_errors|join:" " }}</span>{% endif %}{% endif %}
