{% load i18n %}
{% if items %}
  <nav class="km-breadcrumbs" aria-label="{% trans 'Хлебные крошки' %}">
    <ol class="km-breadcrumbs__list">
      {% for crumb in items %}
        <li class="km-breadcrumbs__item">
          {% if forloop.last %}
            <span class="km-breadcrumbs__current" aria-current="page">{{ crumb.name }}</span>
          {% else %}
            <a class="km-breadcrumbs__link" href="{{ crumb.url }}">{{ crumb.name }}</a>
            <span class="km-breadcrumbs__separator" aria-hidden="true">›</span>
          {% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
