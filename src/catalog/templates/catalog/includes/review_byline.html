<div class="km-review-byline">
  <span class="km-review-byline__avatar" aria-hidden="true">{{ author|first|upper }}</span>
  <div class="km-review-byline__identity">
    <strong>{{ author }}</strong>
    <span class="km-review-byline__stars" role="img" aria-label="{{ review.rating }} / 5">{% for star in "12345" %}<span aria-hidden="true"{% if forloop.counter > review.rating %} class="is-empty"{% endif %}>{% if forloop.counter > review.rating %}☆{% else %}★{% endif %}</span>{% endfor %}</span>
  </div>
  <time datetime="{{ review.created_at|date:'c' }}">{{ review.created_at|date:"d.m.Y" }}</time>
</div>
