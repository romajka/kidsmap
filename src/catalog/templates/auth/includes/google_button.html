{% load i18n %}
{% get_current_language as GOOGLE_LANGUAGE %}
<form method="post" action="{% url 'google_login' %}" class="google-auth-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}" />
  <input type="hidden" name="language" value="{{ GOOGLE_LANGUAGE }}" />
  <button type="submit" class="google-auth-button">
    <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.02 46.98 31.86 46.98 24.55z"/>
      <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>{% if GOOGLE_LANGUAGE == "ru" %}Продолжить с Google{% elif GOOGLE_LANGUAGE == "en" %}Continue with Google{% else %}Google ilə davam et{% endif %}</span>
  </button>
</form>
<div class="google-auth-divider"><span>{% if GOOGLE_LANGUAGE == "ru" %}или через email{% elif GOOGLE_LANGUAGE == "en" %}or with email{% else %}və ya e-poçt ilə{% endif %}</span></div>
