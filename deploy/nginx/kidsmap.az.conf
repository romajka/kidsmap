server {
    listen 80;
    listen [::]:80;
    server_name kidsmap.az www.kidsmap.az;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kidsmap.az$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kidsmap.az;

    ssl_certificate /etc/letsencrypt/live/kidsmap.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidsmap.az/privkey.pem;

    return 301 https://kidsmap.az$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.kidsmap.az;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.kidsmap.az$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kidsmap.az admin.kidsmap.az;

    ssl_certificate /etc/letsencrypt/live/kidsmap.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kidsmap.az/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/html;
    client_max_body_size 25m;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/csv
        text/markdown
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/ttf
        font/otf
        image/svg+xml;

    # Optional: enable only if nginx is built with the brotli module.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/xml
    #     image/svg+xml;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /static/img/favicon.ico =404;
    }

    location /static/ {
        alias /opt/kidsmap/staticfiles/;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /media/ {
        alias /opt/kidsmap/media/;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }
}
